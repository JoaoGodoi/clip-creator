<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Clipper</title>
<style>
  :root {
    --bg: #0f1115; --bg2: #171a21; --bg3: #1f2430; --border: #2a3040;
    --text: #e8eaf0; --muted: #8b93a7; --accent: #7c5cff; --green: #3ecf8e;
    --yellow: #f5c518; --red: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  h1 { font-size: 1.5rem; } h1 span { color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: .75rem; padding: 4px 10px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--border); color: var(--muted); }
  .chip.ok { color: var(--green); border-color: var(--green); }
  .chip.warn { color: var(--yellow); border-color: var(--yellow); }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; }
  input[type=text] { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: .95rem; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); border: none; border-radius: 8px; padding: 12px 22px; color: #fff; font-weight: 600; cursor: pointer; font-size: .9rem; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; font-weight: 500; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 10px; }
  .error { color: var(--red); margin-top: 10px; font-size: .85rem; white-space: pre-wrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
  .video-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform .1s, border-color .1s; }
  .video-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .video-card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .video-card .vc-body { padding: 10px 12px; }
  .video-card .vc-title { font-size: .85rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-card .vc-dur { color: var(--muted); font-size: .75rem; margin-top: 6px; }

  .job { border-left: 3px solid var(--accent); }
  .job h3 { font-size: 1rem; margin-bottom: 4px; }
  .job .stage { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: linear-gradient(90deg, var(--accent), #a78bfa); transition: width .5s; }
  .job.done { border-left-color: var(--green); }
  .job.err { border-left-color: var(--red); }
  .log { background: #0a0c10; border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-family: Consolas, monospace; font-size: .75rem; color: var(--muted); max-height: 180px; overflow-y: auto; white-space: pre-wrap; display: none; }
  .log.show { display: block; }
  .job-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

  .results h4 { margin: 18px 0 10px; font-size: .95rem; color: var(--accent); }
  .clip { display: flex; gap: 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .clip video { border-radius: 8px; background: #000; max-width: 100%; }
  .clip.long video { width: 320px; aspect-ratio: 16/9; }
  .clip.short video { width: 150px; aspect-ratio: 9/16; }
  .clip .meta { flex: 1; min-width: 240px; }
  .clip .meta strong { display: block; margin-bottom: 6px; font-size: .95rem; }
  .clip .meta textarea { width: 100%; height: 110px; background: #0a0c10; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: .78rem; resize: vertical; }
  .clip .meta .dur { color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
  .clip img.thumb { width: 160px; border-radius: 8px; align-self: flex-start; }
  .badge-mock { background: var(--yellow); color: #000; font-size: .7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Podcast <span>Clipper</span></h1>
    <div class="chips" id="chips"></div>
  </header>

  <div class="card">
    <div class="row">
      <input type="text" id="channelUrl" placeholder="Cole a URL do canal (ex: https://www.youtube.com/@canal)">
      <button id="btnList" onclick="listChannel()">Buscar vídeos</button>
    </div>
    <div class="hint">Escolha um vídeo da lista para gerar os cortes longos (10–12 min) e os shorts/reels com legenda.</div>
    <div class="error" id="channelError"></div>
    <div class="grid" id="videoGrid"></div>
  </div>

  <div id="jobsArea"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let polling = null;

async function api(path, body) {
  const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

async function loadHealth() {
  try {
    const h = await api('/api/health');
    const chip = (ok, okText, warnText) =>
      `<span class="chip ${ok ? 'ok' : 'warn'}">${ok ? okText : warnText}</span>`;
    $('chips').innerHTML =
      chip(h.ffmpeg, '✓ ffmpeg', '✗ ffmpeg não encontrado') +
      chip(h.llm_ok, '✓ ' + h.llm_detail, '⚠ ' + h.llm_detail) +
      chip(h.intro, '✓ intro.mp4', '– sem intro') +
      chip(h.outro, '✓ outro.mp4', '– sem ending') +
      `<span class="chip">whisper: ${h.whisper_model}</span>`;
  } catch { /* servidor iniciando */ }
}

async function listChannel() {
  const url = $('channelUrl').value.trim();
  if (!url) return;
  $('channelError').textContent = '';
  $('btnList').disabled = true;
  $('btnList').textContent = 'Buscando…';
  try {
    const data = await api('/api/channel', { url });
    $('videoGrid').innerHTML = data.videos.map(v => `
      <div class="video-card" onclick='startJob(${JSON.stringify(v.url)}, ${JSON.stringify(v.title)})'>
        <img src="${v.thumbnail}" loading="lazy" alt="">
        <div class="vc-body">
          <div class="vc-title">${esc(v.title)}</div>
          <div class="vc-dur">${v.duration_str}</div>
        </div>
      </div>`).join('');
  } catch (e) {
    $('channelError').textContent = e.message;
  } finally {
    $('btnList').disabled = false;
    $('btnList').textContent = 'Buscar vídeos';
  }
}

async function startJob(url, title) {
  if (!confirm(`Gerar cortes de:\n\n${title}\n\nIsso baixa e processa o vídeo inteiro (pode levar vários minutos).`)) return;
  try {
    await api('/api/jobs', { url, title });
    refreshJobs();
    if (!polling) polling = setInterval(refreshJobs, 1500);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  } catch (e) { alert(e.message); }
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function clipCard(c) {
  const isLong = c.kind === 'long';
  return `
    <div class="clip ${isLong ? 'long' : 'short'}">
      <video src="/files/${encodeURI(c.video)}" controls preload="metadata"></video>
      ${isLong && c.thumbnail ? `<img class="thumb" src="/files/${encodeURI(c.thumbnail)}" alt="thumb">` : ''}
      <div class="meta">
        <strong>${esc(c.title)}</strong>
        <div class="dur">${isLong ? (c.duration / 60).toFixed(1) + ' min' : c.duration.toFixed(0) + 's'}</div>
        <textarea readonly>${esc(c.description)}</textarea>
        <div class="job-actions">
          <button class="ghost" onclick="copyDesc(this)">Copiar descrição</button>
        </div>
      </div>
    </div>`;
}

function copyDesc(btn) {
  const ta = btn.closest('.meta').querySelector('textarea');
  navigator.clipboard.writeText(ta.value);
  btn.textContent = 'Copiado ✓';
  setTimeout(() => btn.textContent = 'Copiar descrição', 1500);
}

async function openFolder(path) {
  try { await api('/api/open', { url: path }); } catch (e) { alert(e.message); }
}

function toggleLog(id) { $('log-' + id).classList.toggle('show'); }

async function refreshJobs() {
  const data = await api('/api/jobs').catch(() => null);
  if (!data) return;
  const active = data.jobs.some(j => j.status === 'rodando' || j.status === 'na fila');
  if (!active && polling) { clearInterval(polling); polling = null; }

  $('jobsArea').innerHTML = data.jobs.slice().reverse().map(j => {
    const cls = j.status === 'concluído' ? 'done' : j.status === 'erro' ? 'err' : '';
    const results = (j.results.long.length || j.results.shorts.length) ? `
      <div class="results">
        ${j.results.long.length ? `<h4>🎥 Cortes longos (${j.results.long.length})</h4>` + j.results.long.map(clipCard).join('') : ''}
        ${j.results.shorts.length ? `<h4>📱 Shorts / Reels (${j.results.shorts.length})</h4>` + j.results.shorts.map(clipCard).join('') : ''}
      </div>` : '';
    return `
      <div class="card job ${cls}">
        <h3>${esc(j.video_title)} ${j.mock ? '<span class="badge-mock">MOCK — sem API key</span>' : ''}</h3>
        <div class="stage">${esc(j.stage)} — ${j.status} (${j.progress}%)</div>
        <div class="bar"><div style="width:${j.progress}%"></div></div>
        ${j.error ? `<div class="error">${esc(j.error)}</div>` : ''}
        <div class="job-actions">
          <button class="ghost" onclick="toggleLog('${j.id}')">Ver log</button>
          ${j.output_dir ? `<button class="ghost" onclick='openFolder(${JSON.stringify(j.output_dir)})'>Abrir pasta</button>` : ''}
        </div>
        <div class="log" id="log-${j.id}">${j.log.map(esc).join('\n')}</div>
        ${results}
      </div>`;
  }).join('');
}

loadHealth();
refreshJobs().then(() => {
  const hasActive = document.querySelector('.job:not(.done):not(.err)');
  if (hasActive && !polling) polling = setInterval(refreshJobs, 1500);
});
</script>
</body>
</html>
