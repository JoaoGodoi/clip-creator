<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast Clipper</title>
<style>
  :root {
    --bg: #0f1115; --bg2: #171a21; --bg3: #1f2430; --border: #2a3040;
    --text: #e8eaf0; --muted: #8b93a7; --accent: #7c5cff; --green: #3ecf8e;
    --yellow: #f5c518; --red: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  h1 { font-size: 1.5rem; } h1 span { color: var(--accent); }
  h2 { font-size: 1.05rem; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: .75rem; padding: 4px 10px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--border); color: var(--muted); }
  .chip.ok { color: var(--green); border-color: var(--green); }
  .chip.warn { color: var(--yellow); border-color: var(--yellow); }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; }
  input[type=text] { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: .95rem; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); border: none; border-radius: 8px; padding: 12px 22px; color: #fff; font-weight: 600; cursor: pointer; font-size: .9rem; }
  button:hover { filter: brightness(1.15); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; font-weight: 500; }
  button.danger { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 8px 14px; font-weight: 500; }
  .hint { color: var(--muted); font-size: .8rem; }
  .options-line { margin-top: 12px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .85rem; flex-wrap: wrap; user-select: none; }
  .options-line input { accent-color: var(--accent); width: 16px; height: 16px; }
  .seg { display: flex; gap: 4px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .seg label { display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 6px; cursor: pointer; user-select: none; }
  .seg label:has(input:checked) { background: var(--accent); color: #fff; }
  .seg input { display: none; }
  .error { color: var(--red); margin-top: 10px; font-size: .85rem; white-space: pre-wrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 18px; }
  .video-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform .1s, border-color .1s; }
  .video-card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .video-card img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
  .video-card .vc-body { padding: 10px 12px; }
  .video-card .vc-title { font-size: .85rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-card .vc-dur { color: var(--muted); font-size: .75rem; margin-top: 6px; }

  .job { border-left: 3px solid var(--accent); }
  .job h3 { font-size: 1rem; margin-bottom: 4px; }
  .job .stage { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .bar { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
  .bar div { height: 100%; background: linear-gradient(90deg, var(--accent), #a78bfa); transition: width .5s; width: 0; }
  .job.done { border-left-color: var(--green); }
  .job.err { border-left-color: var(--red); }
  .log { background: #0a0c10; border-radius: 8px; padding: 10px 14px; margin-top: 12px; font-family: Consolas, monospace; font-size: .75rem; color: var(--muted); max-height: 180px; overflow-y: auto; white-space: pre-wrap; display: none; }
  .log.show { display: block; }
  .job-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

  .results h4 { margin: 18px 0 10px; font-size: .95rem; color: var(--accent); }
  .clip { display: flex; gap: 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .clip video { border-radius: 8px; background: #000; max-width: 100%; }
  .clip.long video { width: 320px; aspect-ratio: 16/9; }
  .clip.short video { width: 150px; aspect-ratio: 9/16; }
  .clip .meta { flex: 1; min-width: 240px; }
  .clip .meta strong { display: block; margin-bottom: 6px; font-size: .95rem; }
  .clip .meta textarea { width: 100%; height: 110px; background: #0a0c10; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: .78rem; resize: vertical; }
  .clip .meta .dur { color: var(--muted); font-size: .78rem; margin-bottom: 8px; }
  .clip img.thumb { width: 160px; border-radius: 8px; align-self: flex-start; }
  .badge-mock { background: var(--yellow); color: #000; font-size: .7rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; margin-left: 8px; }

  .storage-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .file-row { display: flex; align-items: center; gap: 12px; padding: 9px 6px; border-bottom: 1px solid var(--border); font-size: .85rem; flex-wrap: wrap; }
  .kit { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .kit button { padding: 5px 10px; font-size: .76rem; }
  .file-row:last-child { border-bottom: none; }
  .file-row .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .fsize { color: var(--muted); white-space: nowrap; }
  .file-row button { padding: 5px 12px; font-size: .78rem; }
  .storage-empty { color: var(--muted); font-size: .85rem; padding: 12px 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Podcast <span>Clipper</span></h1>
    <div class="chips" id="chips"></div>
    <div id="authBox"></div>
  </header>

  <div class="card">
    <div class="row">
      <input type="text" id="channelUrl" placeholder="Cole a URL do canal (ex: https://www.youtube.com/@canal)">
      <button id="btnList" onclick="listChannel()">Buscar vídeos</button>
    </div>
    <div class="options-line">
      <span>Gerar:</span>
      <div class="seg" id="cutsModeSeg">
        <label><input type="radio" name="cutsMode" value="both" checked> 🎬 Os dois</label>
        <label><input type="radio" name="cutsMode" value="shorts"> 📱 Só shorts</label>
        <label><input type="radio" name="cutsMode" value="long"> 🎥 Só longos</label>
      </div>
    </div>
    <label class="options-line">
      <input type="checkbox" id="dopamineChk">
      🧠 Modo dopamina — gameplay em loop na parte de baixo dos shorts
      <span class="hint" id="dopamineHint"></span>
    </label>
    <div class="hint" style="margin-top:8px">Escolha um vídeo da lista para gerar os cortes longos (10–12 min) e os shorts/reels com legenda.</div>
    <div class="error" id="channelError"></div>
    <div class="grid" id="videoGrid"></div>
  </div>

  <div id="jobsArea"></div>

  <div class="card">
    <div class="storage-head">
      <h2>📚 Cortes prontos <span class="hint" id="libraryCount"></span></h2>
      <button class="ghost" onclick="loadLibrary()">Atualizar</button>
    </div>
    <div id="libraryList"><div class="storage-empty">Nenhum corte no disco ainda.</div></div>
  </div>

  <div class="card">
    <div class="storage-head">
      <h2>💾 Arquivos no disco <span class="hint" id="storageTotal"></span></h2>
      <div style="display:flex;gap:8px">
        <button class="ghost" onclick="loadStorage()">Atualizar</button>
        <button class="danger" onclick="deleteAll()">Apagar tudo</button>
      </div>
    </div>
    <div id="storageList"><div class="storage-empty">Carregando…</div></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let polling = null;

async function api(path, body) {
  const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Status ──────────────────────────────────────────────────────────────────

async function loadHealth() {
  try {
    const h = await api('/api/health');
    const chip = (ok, okText, warnText) =>
      `<span class="chip ${ok ? 'ok' : 'warn'}">${ok ? okText : warnText}</span>`;
    $('chips').innerHTML =
      chip(h.ffmpeg, '✓ ffmpeg', '✗ ffmpeg não encontrado') +
      chip(h.llm_ok, '✓ ' + h.llm_detail, '⚠ ' + h.llm_detail) +
      chip(h.intro, '✓ intro.mp4', '– sem intro') +
      chip(h.outro, '✓ outro.mp4', '– sem ending') +
      `<span class="chip">whisper: ${h.whisper_model}</span>`;
    $('dopamineHint').textContent = h.dopamine_videos > 0
      ? `(${h.dopamine_videos} vídeo(s) de fundo)`
      : '(coloque arquivos .mp4 em assets/dopamine/)';
  } catch { /* servidor iniciando */ }
}

// ── Canal ───────────────────────────────────────────────────────────────────

async function listChannel() {
  const url = $('channelUrl').value.trim();
  if (!url) return;
  $('channelError').textContent = '';
  $('btnList').disabled = true;
  $('btnList').textContent = 'Buscando…';
  try {
    const data = await api('/api/channel', { url });
    $('videoGrid').innerHTML = data.videos.map(v => `
      <div class="video-card" onclick='startJob(${JSON.stringify(v.url)}, ${JSON.stringify(v.title)})'>
        <img src="${v.thumbnail}" loading="lazy" alt="">
        <div class="vc-body">
          <div class="vc-title">${esc(v.title)}</div>
          <div class="vc-dur">${v.duration_str}</div>
        </div>
      </div>`).join('');
  } catch (e) {
    $('channelError').textContent = e.message;
  } finally {
    $('btnList').disabled = false;
    $('btnList').textContent = 'Buscar vídeos';
  }
}

function cutsMode() {
  return document.querySelector('input[name="cutsMode"]:checked').value;
}

async function startJob(url, title) {
  const modeLabel = { both: 'shorts + cortes longos', shorts: 'só shorts', long: 'só cortes longos' }[cutsMode()];
  if (!confirm(`Gerar ${modeLabel} de:\n\n${title}\n\nIsso baixa e processa o vídeo inteiro (pode levar vários minutos).`)) return;
  try {
    await api('/api/jobs', { url, title, dopamine: $('dopamineChk').checked, cuts_mode: cutsMode() });
    refreshJobs();
    if (!polling) polling = setInterval(refreshJobs, 1500);
  } catch (e) { alert(e.message); }
}

// ── Jobs (atualização incremental — nada de redesenhar o card) ──────────────

function ensureJobCard(j) {
  let card = $('job-' + j.id);
  if (card) return card;
  card = document.createElement('div');
  card.className = 'card job';
  card.id = 'job-' + j.id;
  card.innerHTML = `
    <h3>${esc(j.video_title)} <span class="badge-mock" style="display:none">MOCK — sem LLM</span></h3>
    <div class="stage"></div>
    <div class="bar"><div></div></div>
    <div class="error"></div>
    <div class="job-actions">
      <button class="ghost" onclick="toggleLog('${j.id}')">Ver log</button>
      <button class="ghost btn-open" style="display:none">Abrir pasta</button>
    </div>
    <div class="log" id="log-${j.id}"></div>
    <div class="results" id="res-${j.id}"></div>`;
  $('jobsArea').prepend(card);
  return card;
}

const jobStatusSeen = {};

function updateJob(j) {
  const card = ensureJobCard(j);
  card.classList.toggle('done', j.status === 'concluído');
  card.classList.toggle('err', j.status === 'erro');
  card.querySelector('.badge-mock').style.display = j.mock ? '' : 'none';

  const stage = `${j.stage} — ${j.status} (${j.progress}%)`;
  const stageEl = card.querySelector('.stage');
  if (stageEl.textContent !== stage) stageEl.textContent = stage;
  card.querySelector('.bar div').style.width = j.progress + '%';
  card.querySelector('.error').textContent = j.error || '';

  const log = $('log-' + j.id);
  const logText = j.log.join('\n');
  if (log.textContent !== logText) {
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 30;
    log.textContent = logText;
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  const btnOpen = card.querySelector('.btn-open');
  if (j.output_dir && btnOpen.style.display === 'none') {
    btnOpen.style.display = '';
    btnOpen.onclick = () => openFolder(j.output_dir);
  }

  appendResults(j);

  const finished = j.status === 'concluído' || j.status === 'erro';
  if (finished && jobStatusSeen[j.id] !== j.status) { loadStorage(); loadLibrary(); }
  jobStatusSeen[j.id] = j.status;
}

function appendResults(j) {
  const res = $('res-' + j.id);
  for (const kind of ['long', 'shorts']) {
    const items = j.results[kind];
    if (!items.length) continue;
    let sec = res.querySelector('.sec-' + kind);
    if (!sec) {
      sec = document.createElement('div');
      sec.className = 'sec-' + kind;
      sec.innerHTML = '<h4></h4><div class="list"></div>';
      kind === 'long' ? res.prepend(sec) : res.append(sec);
    }
    sec.querySelector('h4').textContent = kind === 'long'
      ? `🎥 Cortes longos (${items.length})` : `📱 Shorts / Reels (${items.length})`;
    const list = sec.querySelector('.list');
    for (let i = list.children.length; i < items.length; i++) {
      const holder = document.createElement('div');
      holder.innerHTML = clipCard(items[i]);
      list.append(holder.firstElementChild);
    }
  }
}

function clipCard(c) {
  const isLong = c.kind === 'long';
  return `
    <div class="clip ${isLong ? 'long' : 'short'}">
      <video src="/files/${encodeURI(c.video)}" controls preload="metadata"></video>
      ${isLong && c.thumbnail ? `<img class="thumb" src="/files/${encodeURI(c.thumbnail)}" alt="thumb">` : ''}
      <div class="meta">
        <strong>${esc(c.title)}</strong>
        <div class="dur">${isLong ? (c.duration / 60).toFixed(1) + ' min' : c.duration.toFixed(0) + 's'}</div>
        <textarea readonly>${esc(c.description)}</textarea>
        <div class="job-actions">${manualKit(c)}</div>
      </div>
    </div>`;
}

async function openFolder(path) {
  try { await api('/api/open', { url: path }); } catch (e) { alert(e.message); }
}

function toggleLog(id) { $('log-' + id).classList.toggle('show'); }

async function refreshJobs() {
  const data = await api('/api/jobs').catch(() => null);
  if (!data) return;
  data.jobs.forEach(updateJob);
  const active = data.jobs.some(j => j.status === 'rodando' || j.status === 'na fila');
  if (!active && polling) { clearInterval(polling); polling = null; }
  if (active && !polling) polling = setInterval(refreshJobs, 1500);
}

// ── YouTube: conexão e uploads ──────────────────────────────────────────────

let authPoll = null;
let YT = { configured: false, connected: false };

async function loadAuth() {
  const box = $('authBox');
  try {
    const s = await api('/api/auth/status');
    YT = s;
    if (!s.configured) {
      box.innerHTML = '';  // upload manual: OAuth só aparece se client_secret.json existir
    } else if (!s.connected) {
      box.innerHTML = '<button onclick="connectYT()">🔗 Conectar YouTube</button>';
    } else {
      if (authPoll) { clearInterval(authPoll); authPoll = null; }
      box.innerHTML = `<span class="chip ok">✓ YouTube: ${esc(s.channel || 'conectado')}</span>
        <button class="ghost" style="margin-left:6px;padding:4px 10px;font-size:.75rem" onclick="disconnectYT()">sair</button>`;
    }
  } catch { /* servidor iniciando */ }
}

async function connectYT() {
  try {
    const d = await api('/api/auth/start', {});
    window.open(d.auth_url, '_blank');
    if (!authPoll) authPoll = setInterval(loadAuth, 3000);
  } catch (e) { alert(e.message); }
}

async function disconnectYT() {
  if (!confirm('Desconectar a conta do YouTube?')) return;
  await api('/api/auth/disconnect', {});
  loadAuth();
}

function uploadControl(folder, youtubeUrl) {
  if (!folder) return '';
  if (youtubeUrl) {
    return `<a class="chip ok" style="text-decoration:none" data-folder="${esc(folder)}"
      href="${esc(youtubeUrl)}" target="_blank">▶ no YouTube</a>`;
  }
  if (!YT.connected) return '';  // upload manual: sem OAuth não mostra o botão
  return `<button class="ghost btn-upload" data-folder="${esc(folder)}"
    onclick='uploadClip(this)'>⬆ Enviar ao YouTube</button>`;
}

const CLIPDATA = {};  // folder → {title, description, hashtags} para os botões de copiar

function manualKit(c) {
  CLIPDATA[c.folder] = { title: c.title, description: c.description, hashtags: c.hashtags || [] };
  const f = JSON.stringify(c.folder);
  return `
    <button class="ghost" onclick='openFolder(${f})'>📂 Pasta</button>
    <button class="ghost" onclick='copyText(CLIPDATA[${f}].title, this)'>📋 Título</button>
    <button class="ghost" onclick='copyText(CLIPDATA[${f}].description, this)'>📝 Descrição</button>
    <button class="ghost" onclick='copyText(CLIPDATA[${f}].hashtags.map(t => t.replace("#", "")).join(", "), this)'>🏷 Tags</button>
    ${uploadControl(c.folder, c.youtube_url)}`;
}

function copyText(text, btn) {
  navigator.clipboard.writeText(text || '');
  const original = btn.textContent;
  btn.textContent = 'Copiado ✓';
  setTimeout(() => btn.textContent = original, 1200);
}

let uploadsPoll = null;

async function uploadClip(btn) {
  const folder = btn.dataset.folder;
  try {
    btn.disabled = true;
    btn.textContent = 'Enviando… 0%';
    await api('/api/upload', { url: folder });
    if (!uploadsPoll) uploadsPoll = setInterval(pollUploads, 1500);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '⬆ Enviar ao YouTube';
    alert(e.message);
  }
}

async function pollUploads() {
  const d = await api('/api/uploads').catch(() => null);
  if (!d) return;
  let active = false;
  for (const up of d.uploads) {
    const els = document.querySelectorAll(`[data-folder="${CSS.escape(up.folder)}"]`);
    for (const el of els) {
      if (up.status === 'enviando') {
        active = true;
        el.disabled = true;
        el.textContent = `Enviando… ${up.progress}%`;
      } else if (up.status === 'concluído' && el.tagName === 'BUTTON') {
        el.outerHTML = uploadControl(up.folder, up.url);
      } else if (up.status === 'erro' && el.tagName === 'BUTTON') {
        el.disabled = false;
        el.textContent = '⬆ Tentar de novo';
        el.title = up.error;
        if (!el.dataset.errShown) { el.dataset.errShown = '1'; alert('Falha no upload:\n' + up.error); }
      }
    }
  }
  if (!active && uploadsPoll) { clearInterval(uploadsPoll); uploadsPoll = null; loadLibrary(); }
}

// ── Biblioteca de cortes no disco ───────────────────────────────────────────

async function loadLibrary() {
  try {
    const d = await api('/api/library');
    $('libraryCount').textContent = d.clips.length ? `(${d.clips.length})` : '';
    if (!d.clips.length) {
      $('libraryList').innerHTML = '<div class="storage-empty">Nenhum corte no disco ainda.</div>';
      return;
    }
    $('libraryList').innerHTML = d.clips.map(c => `
      <div class="file-row">
        <span>${c.kind === 'long' ? '🎥' : '📱'}</span>
        <span class="fname" title="${esc(c.episode)}">
          <a href="/files/${encodeURI(c.video)}" target="_blank" style="color:inherit">${esc(c.title)}</a>
          ${c.thumbnail ? ' <span class="hint">🖼 thumb na pasta</span>' : ''}
        </span>
        <span class="fsize">${c.kind === 'long' ? (c.duration / 60).toFixed(1) + ' min' : c.duration.toFixed(0) + 's'}</span>
        <div class="kit">${manualKit(c)}</div>
      </div>`).join('');
  } catch { /* servidor iniciando */ }
}

// ── Arquivos no disco ───────────────────────────────────────────────────────

async function loadStorage() {
  try {
    const data = await api('/api/storage');
    $('storageTotal').textContent = data.items.length
      ? `— ${(data.total_mb / 1000).toFixed(2)} GB no total` : '';
    if (!data.items.length) {
      $('storageList').innerHTML = '<div class="storage-empty">Nada no disco — downloads e cortes aparecem aqui.</div>';
      return;
    }
    $('storageList').innerHTML = data.items.map(it => `
      <div class="file-row">
        <span>${it.type === 'download' ? '⬇️' : '🎬'}</span>
        <span class="fname" title="${esc(it.path)}">${esc(it.name)}</span>
        <span class="fsize">${it.size_mb >= 1000 ? (it.size_mb / 1000).toFixed(2) + ' GB' : it.size_mb + ' MB'}</span>
        <button class="danger" onclick='deleteItem(${JSON.stringify(it.path)}, ${JSON.stringify(it.name)})'>Apagar</button>
      </div>`).join('');
  } catch { /* servidor iniciando */ }
}

async function deleteItem(path, name) {
  if (!confirm(`Apagar "${name}"?\n\nIsso remove o arquivo do disco (a transcrição em cache é mantida).`)) return;
  try {
    const base = path.split('\\').pop();
    document.querySelectorAll('video').forEach(v => {
      if (decodeURI(v.src).includes(base)) { v.pause(); v.removeAttribute('src'); v.load(); }
    });
    await api('/api/delete', { url: path });
    loadStorage();
  } catch (e) { alert(e.message); }
}

async function deleteAll() {
  if (!confirm('Apagar TODOS os vídeos baixados e TODOS os cortes gerados?\n\nAs transcrições em cache são mantidas (re-processar fica rápido).')) return;
  try {
    document.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
    const r = await api('/api/delete_all', {});
    if (r.errors && r.errors.length) alert('Alguns itens não puderam ser apagados:\n' + r.errors.join('\n'));
    loadStorage();
  } catch (e) { alert(e.message); }
}

$('dopamineChk').checked = localStorage.getItem('dopamine') === '1';
$('dopamineChk').onchange = () => localStorage.setItem('dopamine', $('dopamineChk').checked ? '1' : '0');

const savedMode = localStorage.getItem('cutsMode') || 'both';
const savedRadio = document.querySelector(`input[name="cutsMode"][value="${savedMode}"]`);
if (savedRadio) savedRadio.checked = true;
$('cutsModeSeg').onchange = () => localStorage.setItem('cutsMode', cutsMode());

loadHealth();
loadAuth();
loadLibrary();
loadStorage();
refreshJobs();
pollUploads();
</script>
