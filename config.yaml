# Configuração do Podcast Clipper

podcast:
  # Nome do podcast de origem, usado nos créditos das descrições
  nome: ""

paths:
  downloads: data/downloads
  output: output
  assets: assets            # coloque intro.mp4 e outro.mp4 aqui (opcionais)

youtube:
  # Se o download der "Sign in to confirm you're not a bot": login do YouTube
  # pelo navegador. Use firefox (chrome/edge no Windows não funcionam).
  # Ou coloque um cookies.txt na pasta do app, que tem prioridade.
  cookies_from_browser: ""

whisper:
  model: medium             # tiny | base | small | medium | large-v3
  language: pt

llm:
  provider: ollama            # ollama (local, grátis) | anthropic (API, melhor qualidade)
  ollama_model: qwen3:8b
  ollama_url: http://127.0.0.1:11434
  block_minutes: 20           # tamanho do bloco de transcrição analisado por vez (ollama)
  think: true                 # modo "pensar" do qwen3: seleção melhor, um pouco mais lenta
  anthropic_model: claude-sonnet-5   # usado se provider: anthropic (requer ANTHROPIC_API_KEY)

cuts:
  min_score: 6              # nota mínima do juiz para um corte ser aprovado (0 desliga)
  long:
    count: 2                # cortes longos por vídeo
    min_minutes: 10
    max_minutes: 12
  shorts:
    count: 5                # shorts/reels por vídeo
    min_seconds: 20         # dados de 2025/26: shorts de 15-35s retêm melhor
    max_seconds: 50

render:
  crf: 20
  preset: veryfast
  parallel_renders: 3     # quantos cortes renderizam ao mesmo tempo

upload:
  privacy: private        # private | unlisted | public (app não verificado: YouTube força private)
  category_id: "24"       # 24 = Entertainment

branding:
  # Crédito exigido pela licença da música da ending — entra sozinho na
  # descrição dos cortes longos (que levam o outro.mp4).
  ending_music_credit: "🎵 Música da ending: massobeats - rose water (freetouse.com)"
