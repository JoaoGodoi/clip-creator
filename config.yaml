# Configuração do Podcast Clipper

podcast:
  # Nome do podcast de origem, usado nos créditos das descrições
  nome: ""

paths:
  downloads: data/downloads
  output: output
  assets: assets            # coloque intro.mp4 e outro.mp4 aqui (opcionais)

whisper:
  model: medium             # tiny | base | small | medium | large-v3
  language: pt

llm:
  provider: ollama            # ollama (local, grátis) | anthropic (API, melhor qualidade)
  ollama_model: qwen3:8b
  ollama_url: http://localhost:11434
  block_minutes: 20           # tamanho do bloco de transcrição analisado por vez (ollama)
  anthropic_model: claude-sonnet-5   # usado se provider: anthropic (requer ANTHROPIC_API_KEY)

cuts:
  long:
    count: 2                # cortes longos por vídeo
    min_minutes: 10
    max_minutes: 12
  shorts:
    count: 5                # shorts/reels por vídeo
    min_seconds: 25
    max_seconds: 75

render:
  crf: 20
  preset: veryfast

upload:
  privacy: private        # private | unlisted | public (app não verificado: YouTube força private)
  category_id: "24"       # 24 = Entertainment
